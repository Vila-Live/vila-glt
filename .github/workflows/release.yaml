name: Release

# Push a version tag (e.g. v0.2.1) to build the plugin on a Windows runner,
# run the unit tests, and attach the installer and a drop-in zip to a GitHub
# Release. Windows only: the macOS and Linux build files inherited from the
# original project are kept but untested, so no packages are made for them.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset windows-x64
      - name: Unit tests
        run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag -replace '^v', ''
          $dll = "build_x64/RelWithDebInfo/obs-vila-glt.dll"
          if (-not (Test-Path $dll)) { throw "DLL not found at $dll" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # drop-in zip
          New-Item -ItemType Directory -Force -Path "stage/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "stage/data/obs-plugins/obs-vila-glt" | Out-Null
          Copy-Item $dll "stage/obs-plugins/64bit/"
          Copy-Item -Recurse "data/*" "stage/data/obs-plugins/obs-vila-glt/"
          Copy-Item "media/icon.ico" "stage/data/obs-plugins/obs-vila-glt/"
          "Close OBS, then copy the obs-plugins and data folders into your OBS Studio install directory (e.g. C:\Program Files\obs-studio\). The build is unsigned, so SmartScreen may warn." | Set-Content "stage/INSTALL.txt"
          Compress-Archive -Path "stage/*" -DestinationPath "dist/obs-vila-glt-$tag-windows-x64.zip" -Force
          # installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\obs-vila-glt.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Copy-Item "installer/Output/*.exe" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files=$(find artifacts -type f)
          echo "Attaching:"; echo "$files"
          gh release create "$GITHUB_REF_NAME" $files \
            -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
