name: Release

# Push a version tag (e.g. v0.2.1) to build the plugin on a Windows runner,
# run the unit tests, and attach the installer and a drop-in zip to a GitHub
# Release. Windows only: the macOS and Linux build files inherited from the
# original project are kept but untested, so no packages are made for them.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against buildspec.json
        shell: pwsh
        run: |
          # The DLL's version comes from buildspec.json, the file names from
          # the tag; refuse a release where the two differ.
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $spec = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          if ($spec -ne $ver) { throw "Tag $env:GITHUB_REF_NAME does not match buildspec.json version $spec" }
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset windows-x64
      - name: Unit tests
        run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          # Pinned version from the official release; refuse an unsigned or
          # differently signed download.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Inno Setup installer signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag -replace '^v', ''
          $dll = "build_x64/RelWithDebInfo/obs-vila-glt.dll"
          if (-not (Test-Path $dll)) { throw "DLL not found at $dll" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # drop-in zip, OBS 33+ plugin layout:
          #   obs-vila-glt\obs-vila-glt.dll, obs-vila-glt\data\*
          New-Item -ItemType Directory -Force -Path "stage/obs-vila-glt/data" | Out-Null
          Copy-Item $dll "stage/obs-vila-glt/"
          Copy-Item -Recurse "data/*" "stage/obs-vila-glt/data/"
          Copy-Item "media/icon.ico" "stage/obs-vila-glt/data/"
          @(
            "Requires OBS Studio 33 or newer."
            ""
            "Close OBS, then copy the obs-vila-glt folder into"
            "  C:\ProgramData\obs-studio\plugins\"
            "so that the plugin ends up at"
            "  C:\ProgramData\obs-studio\plugins\obs-vila-glt\obs-vila-glt.dll"
            "This works wherever OBS itself is installed, including OBS from Steam."
            ""
            "Portable OBS ignores C:\ProgramData. Copy the obs-vila-glt folder into"
            "  <your OBS folder>\plugins\"
            "instead (create the plugins folder if it does not exist)."
            ""
            "If an older version was installed into C:\Program Files\obs-studio\,"
            "delete obs-plugins\64bit\obs-vila-glt.dll and data\obs-plugins\obs-vila-glt"
            "there, or simply use the installer, which does this for you."
          ) | Set-Content "stage/INSTALL.txt"
          Compress-Archive -Path "stage/*" -DestinationPath "dist/obs-vila-glt-$ver-windows-x64.zip" -Force
          # installer
          $iscc = Get-ChildItem "C:\Program Files\Inno Setup 7\ISCC.exe", "C:\Program Files (x86)\Inno Setup 7\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe (Inno Setup 7) not found" }
          & $iscc.FullName "/DMyAppVersion=$ver" "installer\obs-vila-glt.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Copy-Item "installer/Output/*.exe" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files=$(find artifacts -type f)
          echo "Attaching:"; echo "$files"
          gh release create "$GITHUB_REF_NAME" $files \
            -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
